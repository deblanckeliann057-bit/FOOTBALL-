<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Mini jeu de foot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
    <h2>Mini jeu de foot</h2>
    <canvas id="game" width="900" height="500"></canvas>
    <div class="ui">
      <div class="score" id="score">0 - 0</div>
      <button id="restart">Recommencer</button>
      <div class="hint">
        Contrôles : Joueur gauche = W/A/S/D, Joueur droit = Flèches. Marque dans le but opposé !
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
